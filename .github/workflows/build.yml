name: PS3 Build CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build_ps3:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout do codigo
      uses: actions/checkout@v4

    - name: Instalar Dependencias do Sistema
      run: |
        sudo apt-get update
        sudo apt-get install -y autoconf automake bison flex g++ libelf-dev make texinfo wget zlib1g-dev libncurses5-dev patch bzip2 python3 python3-pip

    - name: Baixar e Configurar PS3 Toolchain Pré-Compilada
      run: |
        # Baixa uma versão estável e pronta da toolchain diretamente do repositório oficial
        wget https://github.com || wget https://github.com
        sudo tar -xzf ps3dev-ubuntu-22.04.tar.gz -C /
        
        # Configura as variáveis de ambiente necessárias que o seu Makefile pede
        echo "PS3DEV=/usr/local/ps3dev" >> $GITHUB_ENV
        echo "/usr/local/ps3dev/bin" >> $GITHUB_PATH
        echo "/usr/local/ps3dev/ppu/bin" >> $GITHUB_PATH

    - name: Compilar o Jogo (.pkg)
      run: |
        # Agora o comando 'make' vai rodar encontrando todos os caminhos configurados acima
        make

    - name: Guardar o instalavel (Artefato)
      uses: actions/upload-artifact@v4
      with:
        name: CupheadVelho-PS3-PKG
        path: "*.pkg"
