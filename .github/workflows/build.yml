name: PS3 Build CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build_ps3:
    runs-on: ubuntu-latest
    container: ps3dev/ps3dev:latest

    steps:
    - name: Checkout do codigo
      uses: actions/checkout@v4

    - name: Compilar o Jogo (.pkg)
      run: |
        make

    - name: Guardar o instalavel (Artefato)
      uses: actions/upload-artifact@v4
      with:
        name: CupheadVelho-PS3-PKG
        path: "*.pkg"
