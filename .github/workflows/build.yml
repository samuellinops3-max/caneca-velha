name: PS3 Build CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build_ps3:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout do codigo
      uses: actions/checkout@v4

    - name: Configurar Compilador do PS3
      run: |
        # Atualiza o gerenciador e instala as ferramentas nativas de compilação
        sudo apt-get update
        sudo apt-get install -y make wget python3

        # Baixa diretamente a toolchain oficial do repositório de lançamentos estáveis
        wget https://github.com
        sudo tar -xzf ps3dev-ubuntu-22.04.tar.gz -C /

        # injeta as variáveis que o seu Makefile precisa para achar a SDK
        echo "PS3DEV=/usr/local/ps3dev" >> $GITHUB_ENV
        echo "PSL1GHT=/usr/local/ps3dev" >> $GITHUB_ENV
        echo "/usr/local/ps3dev/bin" >> $GITHUB_PATH
        echo "/usr/local/ps3dev/ppu/bin" >> $GITHUB_PATH

    - name: Compilar o Jogo (.pkg)
      run: |
        make

    - name: Guardar o instalavel (Artefato)
      uses: actions/upload-artifact@v4
      with:
        name: CupheadVelho-PS3-PKG
        path: "*.pkg"
