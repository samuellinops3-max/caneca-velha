name: Build CANECA BOMBA
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/bucanero/pkgi-ps3:latest
    steps:
      - uses: actions/checkout@v4
      - name: Compilar jogo
        run: |
          export PS3DEV=/usr/local/ps3dev
          export PSL1GHT=$PS3DEV/psl1ght
          export PATH=$PS3DEV/bin:$PSL1GHT/ppu/bin:$PSL1GHT/host/bin:$PATH
          make pkg
          ls -lh *.pkg
      - name: Salvar PKG
        uses: actions/upload-artifact@v4
        with:
          name: CANECA-BOMBA-PKG
          path: "*.pkg"