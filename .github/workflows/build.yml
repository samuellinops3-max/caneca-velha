name: PS3 Build CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build_ps3:
    runs-on: ubuntu-latest
    # Usando a imagem mantida pela comunidade homebrew atual que roda direto no GitHub
    container:
      image: ghcr.io/ps3dev/ps3dev:master

    steps:
    - name: Checkout do codigo
      uses: actions/checkout@v4

    - name: Compilar o Jogo (.pkg)
      run: |
        # Configura as variáveis locais caso o container precise reforçar os caminhos
        export PS3DEV=/usr/local/ps3dev
        export PSL1GHT=$PS3DEV
        export PATH=$PATH:$PS3DEV/bin:$PS3DEV/ppu/bin
        
        make

    - name: Guardar o instalavel (Artefato)
      uses: actions/upload-artifact@v4
      with:
        name: CupheadVelho-PS3-PKG
        path: "*.pkg"
