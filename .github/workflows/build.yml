name: Build CANECA BOMBA
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Instalar kit PS3
        run: |
          sudo apt-get update
          sudo apt-get install -y git make wget python3 build-essential texinfo bison flex gettext libgmp-dev libmpfr-dev libmpc-dev libssl-dev autoconf automake libtool pkg-config zlib1g-dev
          git clone https://github.com/ps3dev/ps3toolchain.git $HOME/ps3toolchain
          cd $HOME/ps3toolchain
          sudo ./toolchain.sh
      - name: Instalar PSL1GHT
        run: |
          export PS3DEV=/usr/local/ps3dev
          export PSL1GHT=$PS3DEV/psl1ght
          git clone https://github.com/ps3dev/PSL1GHT.git $HOME/PSL1GHT
          cd $HOME/PSL1GHT
          make install
      - name: Compilar jogo
        run: |
          export PS3DEV=/usr/local/ps3dev
          export PSL1GHT=$PS3DEV/psl1ght
          export PATH=$PS3DEV/bin:$PSL1GHT/ppu/bin:$PSL1GHT/host/bin:$PATH
          make pkg
          ls -lh *.pkg
      - name: Salvar PKG
        uses: actions/upload-artifact@v4
        with:
          name: CANECA-BOMBA-PKG
          path: "*.pkg"