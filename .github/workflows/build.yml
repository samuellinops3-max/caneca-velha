name: Build CANECA BOMBA
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: ps3dev/psl1ght:latest
    steps:
      - uses: actions/checkout@v4
      - name: Compilar jogo
        run: |
          export PSL1GHT=/usr/local/psl1ght
          export PATH=$PSL1GHT/ppu/bin:$PSL1GHT/host/bin:$PATH
          make pkg
          ls -lh *.pkg
      - name: Salvar PKG
        uses: actions/upload-artifact@v4
        with:
          name: CANECA-BOMBA-PKG
          path: "*.pkg"