name: PS3 Build CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build_ps3:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do codigo
      uses: actions/checkout@v4

    - name: Instalar Compilador Nativo
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc make

    - name: Compilar Código Fonte
      run: |
        # Compila seu arquivo main.c diretamente sem depender de links externos
        gcc main.c -o CupheadVelhoPS3 -O2

    - name: Guardar o executavel (Artefato)
      uses: actions/upload-artifact@v4
      with:
        name: CupheadVelho-Build
        path: CupheadVelhoPS3
