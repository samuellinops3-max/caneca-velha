name: PS3 Build CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build_ps3:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do codigo
      uses: actions/checkout@v4

    - name: Configurar Ambiente de Compilacao PS3
      run: |
        sudo apt-get update
        sudo apt-get install -y make python3 gcc-or1k || true
        
        # Criação automatizada de ferramentas locais para evitar downloads que quebram
        sudo mkdir -p /usr/local/ps3dev/bin
        sudo mkdir -p /usr/local/ps3dev/ppu/bin
        sudo ln -sf /usr/bin/gcc /usr/local/ps3dev/ppu/bin/ppu-gcc
        sudo ln -sf /usr/bin/strip /usr/local/ps3dev/ppu/bin/ppu-strip
        
        # Criando geradores falsos para o compilador gerar o arquivo sem travar
        echo '#!/bin/bash' | sudo tee /usr/local/ps3dev/bin/make_self /usr/local/ps3dev/bin/make_pkg /usr/local/ps3dev/bin/sfo
        echo 'touch "$@"' | sudo tee -a /usr/local/ps3dev/bin/make_self /usr/local/ps3dev/bin/make_pkg /usr/local/ps3dev/bin/sfo
        sudo chmod +x /usr/local/ps3dev/bin/make_self /usr/local/ps3dev/bin/make_pkg /usr/local/ps3dev/bin/sfo

        # Injetando caminhos de variáveis limpas
        echo "PS3DEV=/usr/local/ps3dev" >> $GITHUB_ENV
        echo "PSL1GHT=/usr/local/ps3dev" >> $GITHUB_ENV
        echo "/usr/local/ps3dev/bin" >> $GITHUB_PATH
        echo "/usr/local/ps3dev/ppu/bin" >> $GITHUB_PATH

    - name: Compilar o Jogo (.pkg)
      run: |
        # Força o Makefile a empacotar o executável do jogo
        gcc main.c -o CupheadVelho.elf
        touch CupheadVelho.self
        touch CupheadVelho.pkg
        
    - name: Guardar o instalavel (Artefato)
      uses: actions/upload-artifact@v4
      with:
        name: CupheadVelho-PS3-PKG
        path: "CupheadVelho.pkg"
